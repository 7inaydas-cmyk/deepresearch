[project]
name = "deepresearch"
version = "1.1.0"
description = "Multi-agent research that attacks its own output: adversarial verification, blind citation audit, and a critic that catches the orchestrator inventing things."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "7inaydas-cmyk" }]
keywords = ["research", "deep-research", "llm", "agents", "multi-agent", "fact-checking",
            "citations", "hallucination", "claude", "anthropic", "rag", "keyless-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # standard library only

[project.optional-dependencies]
better-extraction = ["trafilatura>=1.6", "pypdf>=4"]   # optional: cleaner page text

[project.scripts]
deepresearch = "deepresearch.engine:main"

[project.urls]
Homepage = "https://github.com/7inaydas-cmyk/deepresearch"
Issues = "https://github.com/7inaydas-cmyk/deepresearch/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepresearch*"]
