# SearXNG settings for deepresearch.
#
# The single line that matters is `formats: [html, json]`. Every PUBLIC SearXNG
# instance disables the json format precisely to stop automated use, which is why
# pointing DR_SEARXNG_URL at someone else's instance does not work and would not
# be polite if it did. Run your own; it is one container.
use_default_settings: true

server:
  # Local-only instance bound to 127.0.0.1, so this is not protecting anything.
  # If you expose this container to a network, replace it with a real random value.
  secret_key: "deepresearch-local-only-not-a-shared-secret"
  # The rate limiter exists to stop bots hammering a public instance. On a
  # single-user local instance it only throttles your own research run.
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

# One research run makes ~90 searches in a few minutes. The default engine set is four
# providers that all rate-limit, and measured 2026-09-06 a single run suspended all of
# them: brave and google cse "too many requests", duckduckgo "timeout", startpage
# "CAPTCHA". The instance then answers 200 with an empty list, which reads as "the web
# has nothing to say".
#
# So widen the pool and lengthen the memory. These engines do not share a rate limit, so
# the load spreads instead of concentrating.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: crossref
    disabled: false
  - name: openairedatasets
    disabled: true
  - name: semantic scholar
    disabled: false
  - name: pubmed
    disabled: false
  - name: arxiv
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: hackernews
    disabled: false
  - name: reddit
    disabled: false
  - name: startpage
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
