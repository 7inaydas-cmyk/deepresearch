name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite stubs the model and the network, so it needs no API key and no
    # internet. That is the point: anyone can verify the pipeline's behaviour
    # without spending a token.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: No dependencies to install
        run: python -c "import sys; print(sys.version)"
      - name: Offline pipeline tests
        run: python tests/test_pipeline.py
      - name: Import cleanly with no network
        run: python -c "import deepresearch; print(deepresearch.__version__)"

  workflow-js:
    # The Claude Code workflow build has its own offline suite: it stubs the
    # Workflow runtime's agent/parallel/pipeline primitives, so it needs no key
    # and no network either. It exists because the two runtimes drifted five
    # features apart when only one of them was tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check integrations/claude-code/deepresearch.js
      - run: cd tests/claude-code && node test-workflow.mjs

  contract:
    # The tier rules are shared between the Python engine and the Claude Code
    # workflow. If this file drifts or stops parsing, both runtimes grade
    # sources differently and nobody notices until a report is wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: contract/tiers.json is valid and complete
        run: |
          python - <<'PY'
          import json, re
          c = json.load(open("contract/tiers.json"))
          for key in ("resolvers", "rules", "farm_tells", "rank", "citable"):
              assert key in c, "missing key: " + key
          for tier, pat in c["rules"]:
              re.compile(pat)                      # every rule must compile
              assert tier in c["rank"], tier       # and be rankable
          assert "doi.org" in c["resolvers"], "doi.org must be treated as a resolver"
          assert c["rank"]["T1"] < c["rank"]["T3"], "tier ranking is inverted"
          # Rules are evaluated in order, so a host listed in a lower tier that is
          # already matched by a higher one is DEAD - it can never fire, and the
          # file would be claiming a grade it never applies. pubmed.ncbi.nlm.nih.gov
          # sat dead in T2 behind nih.gov in T1 from the day it was written.
          import re as _re
          def _hosts(pat):
              m = _re.search(r"\(\^\|\\\.\)\((.*)\)\$", pat)
              return [h.replace("\\", "") for h in m.group(1).split("|")] if m else []
          seen, dead = [], []
          for tier, pat in c["rules"]:
              for h in _hosts(pat):
                  for pt, pp in seen:
                      if _re.search(pp, h, _re.I):
                          dead.append((tier, h, pt)); break
              seen.append((tier, pat))
          assert not dead, "dead rules shadowed by a higher tier: %s" % dead
          print("tiers.json OK: %d rules, %d resolvers" % (len(c["rules"]), len(c["resolvers"])))
          PY

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck install.sh
